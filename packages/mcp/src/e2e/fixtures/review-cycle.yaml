# Review Cycle — full flagship E2E fixture (neutral, story-free).
#
# Deliberately industry-neutral (AMENDMENTS.md A70): this workflow and its
# compiled `review-cycle.workflow.json` sibling replace a former example
# workflow that carried a specific customer/domain narrative, removed from
# the product (2026-07-14). The flow shape, wait/resume structure, and real-vs-fixture
# block split are preserved assertion-for-assertion — see
# `review-cycle.e2e.test.ts`'s own header comment for the coverage mapping.
#
# The flow:
#
#   record submitted -> parse document -> llm.extract fields ->
#   deterministic validation -> human review/correction -> run a scoring
#   computation -> render a recommendation summary -> human approval ->
#   export/artifact -> compute next-review window -> timer wait ->
#   re-enter market scan (guarded cycle, spec §18.2)
#
# "record submitted" has no dedicated step: this workflow's `documentText`
# input models the already-parsed/uploaded document content arriving as
# trigger input (architecture's trigger -> inputs model) — "submission" is
# what produces that input, not a step this workflow itself executes.
#
# Domain-pack-shaped fixture blocks (registered only in
# `review-cycle.e2e.test.ts`/`review-cycle-worker.mjs`'s own BlockRegistry,
# never implemented in `@aart/blocks-core`): `demo.parse`, `demo.validate`,
# `demo.compute` (used twice — the initial scoring pass AND the guarded
# rescan step, same block id reused both places, matching the removed
# original fixture's own precedent of reusing one block id both places),
# `demo.render`,
# `demo.compute_window`. This is authored as real `uses:` references anyway
# — matching what a real user would write against an installed pack.
#
# Every OTHER step below (llm.extract, human.approval (x2), wait.until,
# artifact.write) is a REAL, fully-implemented `@aart/blocks-core`/
# `@aart/llm` block, dispatched through the real `@aart/engine` with no
# fixture substitution — this is the load-bearing property the E2E test
# proves (real branching/dispatch/durability, not fixture-shaped theater).

id: review-cycle
name: "Review Cycle — Document Intake & Periodic Recheck Workflow"
version: 0.1.0

inputs:
  recordId:
    type: string
    required: true
  documentText:
    type: string
    required: true
    description: "Already-parsed/uploaded document text (upload happens upstream of this workflow)."

steps:
  - id: parse_document
    uses: demo.parse
    with:
      rawText: "{{ inputs.documentText }}"

  - id: extract_fields
    uses: llm.extract
    with:
      model: "anthropic/claude-sonnet-5"
      prompt: "Extract the record code, total amount, quantity, category, and next review date from this document."
      input: "{{ steps.parse_document.outputs.structuredText }}"
      outputSchema:
        type: object
        properties:
          recordCode: { type: string }
          totalAmount: { type: number }
          quantity: { type: number }
          category: { type: string }
          nextReviewDate: { type: string }
        required: [recordCode, totalAmount, quantity, category, nextReviewDate]

  - id: validate_fields
    uses: demo.validate
    with:
      recordCode: "{{ steps.extract_fields.outputs.recordCode }}"
      totalAmount: "{{ steps.extract_fields.outputs.totalAmount }}"
      quantity: "{{ steps.extract_fields.outputs.quantity }}"

  - id: review_fields
    uses: human.approval
    with:
      title: "Confirm or correct extracted fields"
      description: "Review the extracted fields before they're used to compute a recommendation."

  - id: run_scoring
    uses: demo.compute
    with:
      recordId: "{{ inputs.recordId }}"
      validatedFields: "{{ steps.validate_fields.outputs }}"

  - id: render_summary
    uses: demo.render
    with:
      recordId: "{{ inputs.recordId }}"
      scoring: "{{ steps.run_scoring.outputs }}"

  - id: approve_summary
    uses: human.approval
    with:
      title: "Approve recommendation summary"
      description: "Approve this summary before it's exported."

  - id: export_report
    uses: artifact.write
    with:
      name: "recommendation-summary.pdf"
      kind: pdf
      mime: application/pdf
      content: "{{ steps.render_summary.outputs.summary }}"

  - id: compute_next_window
    uses: demo.compute_window
    with:
      nextReviewDate: "{{ steps.extract_fields.outputs.nextReviewDate }}"

  - id: recheck_wait
    uses: wait.until
    with:
      resumeAt: "{{ steps.compute_next_window.outputs.resumeAt }}"

  - id: rescan
    uses: demo.compute
    with:
      recordId: "{{ inputs.recordId }}"
    maxIterations: 6
    next: recheck_wait
