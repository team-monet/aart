# Example login QA workflow composing QA-pack blocks. Credentials come from
# secrets (AART_SECRET_EMAIL / AART_SECRET_PASSWORD or .aa/secrets.json) and are
# redacted from the report. Run e.g.:
#   AART_SECRET_EMAIL=me@x.com AART_SECRET_PASSWORD=hunter2 \
#     aart run examples/qa/login-smoke.yaml --input '{"appUrl":"http://localhost:3000"}'
id: login-smoke
name: Login Smoke
version: 0.1.0
inputs:
  - name: appUrl
    type: string
    required: true
execution:
  type: workflow
  steps:
    - id: open_login
      block: qa.browser.goto
      inputs:
        url: "{{inputs.appUrl}}/login"
    - id: fill_email
      block: qa.browser.fill
      inputs:
        selector: "input[name=email]"
        value: "{{secrets.email}}"
    - id: fill_password
      block: qa.browser.fill
      inputs:
        selector: "input[name=password]"
        value: "{{secrets.password}}"
    - id: submit
      block: qa.browser.click
      inputs:
        selector: "button[type=submit]"
    - id: assert_dashboard
      block: qa.browser.text_visible
      inputs:
        text: "Dashboard"
    - id: screenshot
      block: qa.browser.screenshot
      inputs:
        name: "dashboard-after-login"
