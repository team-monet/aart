name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci` runs `prepare` → `npm run build`, so a build failure fails CI too.
      - run: npm ci

      # The browser.* blocks drive real Chromium, so the test suite needs it.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - run: npm run typecheck

      - run: npm test
