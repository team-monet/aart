name: CI

on:
  push:
  pull_request:

env:
  # Keep in sync with package.json engines.node / this repo's pinned dev toolchain.
  NODE_VERSION: "22"
  PNPM_VERSION: "10.33.2"

jobs:
  ci:
    runs-on: ubuntu-latest
    # GitHub's own unset-default is 360 (6 HOURS) per job — with none set,
    # a step that hangs instead of failing (exactly what happened on the
    # first run on a fresh main, run 29148548882: the familiarity-evals CI
    # gate step held the job open 30+ minutes past its own logical
    # completion because a leaked Playwright browser subprocess kept
    # Node's event loop non-empty, since fixed at the root — see
    # packages/familiarity-evals/src/ci-gate.ts) burns the full 6 hours
    # before anyone notices, instead of failing fast. 20 minutes is
    # generous headroom over this job's actual shape (Playwright browser
    # download + OS deps, a full workspace build/typecheck, the full test
    # suite, redaction lint, the familiarity-evals gate) while still
    # bounding a future regression of the same kind to a fast, visible
    # failure rather than a silent multi-hour hang.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The public catalog is intentionally outside the pnpm workspace: it
      # is a separately deployable Sites/npm project with its own lockfile.
      # Root `pnpm install` therefore cannot provide vinext or its build
      # dependencies.
      - name: Cache catalog npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-catalog-npm-${{ hashFiles('packages/catalog/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-catalog-npm-

      - name: Install catalog dependencies
        run: npm ci --prefix packages/catalog

      # --- Platform smoke tests (implementation plan §2 / §6 Risk 3) ---
      # Deliberately an EARLY, explicit step, before build/typecheck/test:
      # Playwright and isolated-vm are both real cross-platform-friction
      # dependencies (a browser binary download; a native V8-isolate addon
      # compiled via node-gyp). Surfacing an install/runtime failure here,
      # at the foundation layer, is the whole point — not discovering it
      # whenever a later Wave-1 session's own tests first touch either one.
      - name: Install Playwright's chromium browser (with OS deps)
        run: npx playwright install --with-deps chromium

      - name: Smoke test — headless browser (Playwright)
        run: pnpm run smoke:browser

      - name: Smoke test — isolated-vm
        run: pnpm run smoke:isolated-vm

      # S10 completion session — root AMENDMENTS.md A34. Structural guard:
      # `tsc -b` derives build order from each package's OWN tsconfig.json
      # "references", not from package.json "dependencies". A mismatch
      # between the two is invisible from a warm dist/ and can even survive
      # a clean build by accident (incidental position in tsconfig.build
      # .json's own reference list can happen to build the real dependency
      # first anyway) — it only reliably surfaces as a cascading wall of
      # TS2307 errors. Runs BEFORE Build, deliberately: plain node, no
      # build/typecheck dependency, so it fails fast and legibly instead of
      # a future workspace-dependency addition silently becoming a
      # cascading tsc dump someone has to reverse-engineer.
      - name: Check tsconfig.json project references match package.json dependencies
        run: pnpm run check:tsconfig-refs

      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      # S9 integration, reconciliation ledger item 14 — tsconfig.base.json
      # excludes *.test.ts from the tsc -b build above (correctly: test
      # files aren't shipped package output), which meant NO test file in
      # this repo had ever been type-checked by anything other than
      # vitest's own looser, non-type-checking transform. This is a
      # separate --noEmit pass over every package's *.test.ts too. See
      # root AMENDMENTS.md A31 for the real, previously-hidden type errors
      # this caught on its first run.
      - name: Typecheck — test files
        run: pnpm run typecheck:tests

      - name: Test
        run: pnpm run test

      # S9 integration, reconciliation ledger item 14 (root AMENDMENTS.md
      # A29 -> A41). BLOCKING: A29 flagged 187 untriaged findings and left
      # this step informational (continue-on-error) until a follow-up
      # session finished the triage. A41 (this session) triaged the full
      # 186-finding repo-wide baseline to a trustworthy zero — 1 genuine
      # redaction bypass fixed as real code (@aart/engine's
      # executeWaitDispatch, a human.approval step's ApprovalTask now
      # routes through applyRedaction), 185 reviewed and suppressed with
      # individual justifications in
      # packages/governance/src/redaction-lint-suppressions.ts. The lint
      # now exits 0 on a clean run and exits 1 both on any new, unreviewed
      # finding and on any suppression entry that goes stale (its guarded
      # code changed since review) — see A41 for the full taxonomy.
      - name: Lint — redaction bypass scan
        run: pnpm run lint:redaction

      # S9 integration, reconciliation ledger item 14 (root AMENDMENTS.md
      # A30). Fake-model harness verification, not a real-model baseline —
      # no LLM provider API key is available in CI as configured today.
      # See A30's own disclosure.
      - name: Familiarity-evals CI gate (fake model)
        run: pnpm run eval:familiarity
