name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # `npm ci` runs `prepare` -> `npm run build`, so a build failure fails CI
      # too. Node 22+ is required: the node-block sandbox dep `isolated-vm` needs
      # >=22 and the build references its types. (Node 20 consumers use the
      # prebuilt `dist` at runtime, with the sandbox disabled.)
      - run: npm ci

      # The browser.* blocks drive real Chromium, so the test suite needs it.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - run: npm run typecheck

      - run: npm test
