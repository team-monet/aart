# AART production deploy example (AMENDMENTS.md A49) — server + worker +
# dashboard sharing one store volume, environment-scoped, secrets via .env.
# This is a SHAPE to adapt, not a drop-in prod config — see DEPLOY.md for
# what to change per real deployment (TLS termination, real secret backend,
# resource limits, restart policy tuning) and its "Ops limits" section for
# what this stack is honest about NOT providing on its own (no built-in
# auth in front of the dashboard/control-plane HTTP APIs, single-instance
# scheduler ticker, etc.).
#
# Quick start (published image — AMENDMENTS.md A69):
#   cp .env.example .env              # fill in AART_SECRET_* values, and
#                                      # AART_DEPLOY_TOKEN if you want to
#                                      # `aart push`/`aart_deploy` at this
#                                      # server remotely (D1, AMENDMENTS.md
#                                      # A56 — see DEPLOY.md's "Deploy token")
#   docker compose pull               # pulls ghcr.io/team-monet/aart —
#                                      # published by .github/workflows/
#                                      # publish-containers.yml on every
#                                      # v* tag; the lean (no-browser) image
#                                      # — see DEPLOY.md for --with-browser
#   docker compose up -d
#   curl http://localhost:8080/health
#   curl http://localhost:8787/health
#   open http://localhost:4000        # dashboard
#
# Building from source instead of pulling: each service below has its
# `image:` line active and a matching `build:` block commented out right
# beneath it — swap which one is commented per service (all three, kept
# consistent) and run `docker compose up -d --build` instead of `pull`. See
# DEPLOY.md's "Path A — Docker / Compose" for the full build-from-source
# walkthrough (git clone, `docker build`, `--with-browser`, etc.).
#
# Store: sqlite (the multi-process-safe choice — see DEPLOY.md's "Store
# choice: fs vs sqlite" section for the precise, post-AMENDMENTS.md-A58
# statement of what "safe" means here, including the now-coordinated
# concurrent-first-startup case this exact server+worker topology hits on a
# fresh volume; fs is single-process-only and would race under server+worker
# writing concurrently to the same store). One named volume, mounted
# read-write into all three services, is what makes this "sharing a store
# volume" — the same store, the same runs/workflows/deployments, seen from
# three different processes.
#
# Environment scoping: AART_ENVIRONMENT (server-only; worker/dashboard have
# no environment-scoping flag of their own — see DEPLOY.md) restricts which
# deployments' triggers this server activates (`--environment`/
# AART_ENVIRONMENT, AMENDMENTS.md A45). Set it once a real named Environment
# exists on this store — either `aart deploy <workflowId> --target
# production` (auto-vivifies a minimal one on first deploy), or the more
# deliberate `aart environment register production --trust-mode <mode>`
# (ADR-2, D1, AMENDMENTS.md A56 — the one that actually lets you pick a
# trust mode instead of silently defaulting to `governed`), run against
# this same store/volume (`docker compose exec server aart environment
# register ...` — or remotely, `aart push`'s own `POST /environments`, once
# AART_DEPLOY_TOKEN above is set).

services:
  server:
    # Published image (AMENDMENTS.md A69) — ghcr.io/team-monet/aart,
    # multi-arch (linux/amd64, linux/arm64), built+pushed by
    # .github/workflows/publish-containers.yml on every `v*` tag. Pinned to
    # an exact version, not `:latest`, so this file's own "SHAPE to adapt"
    # framing (see header comment) doesn't silently drift underneath a
    # deployment on an unrelated `docker compose pull` — bump this
    # deliberately as part of DEPLOY.md's own "Upgrade procedure". Swap
    # to `ghcr.io/team-monet/aart:latest` if you'd rather always float to
    # the newest tagged release instead.
    image: ghcr.io/team-monet/aart:0.10.0
    # Build from source instead of pulling (contributors, local dev, or a
    # platform GHCR doesn't cover) — comment out `image:` above and
    # uncomment this block instead, on all three services consistently:
    # build:
    #   context: .
    #   # dockerfile: Dockerfile (default — implicit)
    #   target: runtime # swap to runtime-browser if any deployed workflow uses browser.* steps
    # --host 0.0.0.0 (D2a security hardening, breaking-change bind default,
    # AMENDMENTS.md A59) — REQUIRED here, not optional: `aart server` now
    # binds loopback-ONLY (127.0.0.1) by default, which inside a container
    # means "reachable only from a process in THIS SAME container's network
    # namespace" — neither the `dashboard` service's own `AART_SERVER_URL:
    # http://server:8080` (a Docker network alias) NOR this service's own
    # published `8080:8080` port mapping to the host would be able to reach
    # it without this flag; the healthcheck below runs `curl` INSIDE this
    # same container's namespace, so it would keep passing even if this
    # flag were dropped, silently masking exactly that regression. See
    # DEPLOY.md's "Network binding" section for the full migration note.
    command: ["server", "--port", "8080", "--host", "0.0.0.0", "--store", "sqlite"]
    ports:
      - "8080:8080"
    volumes:
      - aart-store:/data
    environment:
      AART_ROOT: /data
      # AART_ENVIRONMENT: production   # uncomment once you have a real named Environment to scope to
      AART_TRUST_MODE: governed # spec §17.2's own local/CI default — explicit here rather than implicit
    env_file:
      - .env # AART_SECRET_* values (webhook HMAC secrets, etc.) + AART_DEPLOY_TOKEN (D1 remote push/registration gate, AMENDMENTS.md A56) — see DEPLOY.md
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  worker:
    # Published image — see `server`'s own `image:`/`build:` comment above;
    # MUST stay the same tag/target as `server` (a worker without Chromium
    # can't dispatch browser.* steps a browser-enabled server accepted).
    image: ghcr.io/team-monet/aart:0.10.0
    # build:
    #   context: .
    #   target: runtime # MUST match server's target — a worker without Chromium can't dispatch browser.* steps a browser-enabled server accepted
    command: ["worker", "--store", "sqlite"]
    volumes:
      - aart-store:/data
    environment:
      AART_ROOT: /data
      AART_TRUST_MODE: governed
    env_file:
      - .env
    depends_on:
      server:
        condition: service_healthy
      # AMENDMENTS.md A58: sqlite's concurrent-startup migration race is now
      # coordinated (packages/store/src/adapters/sqlite/index.ts's
      # runMigrationsCoordinated) so a genuinely concurrent server+worker
      # start no longer crashes either process — this dependency isn't load-
      # bearing for correctness anymore. Kept anyway (mirroring the
      # `dashboard` service's own existing depends_on below) as the simpler,
      # deterministic startup order: the server is the one process this
      # compose file expects to apply this store's schema first in the
      # common case, so waiting for its healthcheck avoids EVERY process
      # racing to be first, not just avoiding a crash.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    # No published port by default — the worker's :8787 health endpoint is
    # only needed by the dashboard's worker-health page (AART_WORKER_URLS
    # below) and by an operator directly `docker compose exec`-ing in.
    # Uncomment to reach it from the host too:
    # ports:
    #   - "8787:8787"

  dashboard:
    # Published image — see `server`'s own `image:`/`build:` comment above.
    image: ghcr.io/team-monet/aart:0.10.0
    # build:
    #   context: .
    #   target: runtime
    command: ["dashboard"]
    ports:
      - "4000:4000"
    volumes:
      - aart-store:/data
    environment:
      AART_ROOT: /data
      AART_STORE: sqlite
      AART_SERVER_URL: http://server:8080
      AART_WORKER_URLS: http://worker:8787
    env_file:
      - .env # AART_DEPLOY_TOKEN (D1 fix pass, AMENDMENTS.md A57) — this dashboard's server-side ApiClient attaches it as a Bearer header on POST /workflows/:id/promote, matching the `server` service's own AART_DEPLOY_TOKEN below (requireDeployTokenIfConfigured, http/server.ts) — without it, promoting a workflow from the dashboard 401s the moment AART_DEPLOY_TOKEN is set on `server`. AART_SECRET_* values are harmless-but-unused here (the dashboard never resolves a secretSource itself) — same file, no separate one needed.
    depends_on:
      server:
        condition: service_healthy
      worker:
        condition: service_healthy
    restart: unless-stopped
    # Ops limits (DEPLOY.md elaborates): @aart/dashboard is API-complete
    # (AMENDMENTS.md A47) — every read AND write route (trigger a run,
    # approve/promote/block a workflow version, decide an approval task,
    # record/act on a correction, create/run an eval suite, clear a run's
    # flag) goes through the SAME real @aart/server HTTP API + underlying
    # functions the CLI/MCP surfaces call, not a dashboard-local
    # reimplementation. The two remaining gaps are narrower: resuming a
    # run's own wait step and rendering the HTML execution report are
    # still local mirrors, not yet wired to the real engine/evidence
    # packages. The dashboard has no built-in auth (DEPLOY.md's own "No
    # authentication" note) — scope its network exposure accordingly
    # regardless of write-completeness. AART_DEPLOY_TOKEN (D1 fix pass,
    # AMENDMENTS.md A57) authenticates only this dashboard's OWN promote
    # hop to `server` — it does not add login/auth in front of the
    # dashboard's own UI/API for a browsing operator.

volumes:
  aart-store:
